services:
  fetcherr-usenet:
    image: ghcr.io/goneturbo/fetcherr:usenet
    container_name: fetcherr-usenet
    restart: unless-stopped
    ports:
      - "9991:9990"
    environment:
      PORT: "9990"
      DATABASE_PATH: /app/data/fetcherr.db
      SERVER_NAME: "Fetcherr Usenet"
      SERVER_ID: "fetcherr-usenet-001"
      SERVER_URL: "${USENET_SERVER_URL:-http://localhost:9991}"
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      TVDB_API_KEY: "${TVDB_API_KEY:-}"
      TRAKT_CLIENT_ID: "${TRAKT_CLIENT_ID:-}"
      TRAKT_CLIENT_SECRET: "${TRAKT_CLIENT_SECRET:-}"
      TRAKT_USERNAME: "${TRAKT_USERNAME:-}"
      PROWLARR_URL: "${PROWLARR_URL:-}"
      PROWLARR_API_KEY: "${PROWLARR_API_KEY:-}"
      NNTP_HOST: "${NNTP_HOST:-}"
      NNTP_PORT: "${NNTP_PORT:-563}"
      NNTP_USER: "${NNTP_USER:-}"
      NNTP_PASS: "${NNTP_PASS:-}"
      NNTP_SSL: "${NNTP_SSL:-true}"
      NNTP_CONNECTIONS: "${NNTP_CONNECTIONS:-10}"
    volumes:
      - ./data-usenet:/app/data
